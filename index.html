<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Подбор вентиляции</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #eef2f5; font-family: system-ui; padding: 20px; }
        .app { max-width: 700px; margin: 0 auto; }
        .page { display: none; }
        .page.active { display: block; }
        .card { background: white; border-radius: 24px; padding: 16px; margin-bottom: 16px; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.1); display: flex; gap: 16px; align-items: center; }
        .card:hover { background: #fff7ed; }
        .card-img { width: 80px; height: 80px; background: #ddd; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 12px; color: gray; }
        .card-title { font-weight: 600; }
        .card-btn { background: #f97316; color: white; padding: 8px 16px; border-radius: 30px; display: inline-block; margin-top: 8px; font-size: 14px; }
        .form-card { background: white; border-radius: 24px; padding: 24px; }
        input, textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 16px; margin-bottom: 16px; }
        button { background: #f97316; color: white; border: none; padding: 14px; border-radius: 40px; font-size: 16px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 8px; }
        .btn-gray { background: #e2e8f0; color: #333; }
        .back-link { text-align: center; margin-top: 16px; }
        .back-link button { background: none; color: #f97316; width: auto; padding: 8px; text-decoration: underline; }
        .selected-tag { background: #f1f5f9; padding: 8px 16px; border-radius: 40px; display: inline-block; margin-bottom: 20px; font-size: 14px; }
        .mode-switch { display: flex; gap: 12px; margin-bottom: 20px; }
        .mode-btn { flex: 1; background: #e2e8f0; color: #333; }
        .mode-btn.active { background: #f97316; color: white; }
        .form-panel { display: none; }
        .form-panel.show { display: block; }
        .double-buttons { display: flex; gap: 12px; }
        .hoods-section { display: none; background: #f8fafc; padding: 16px; border-radius: 20px; margin-top: 16px; }
        .hoods-section.show { display: block; }
        .hood-item { border-top: 1px solid #ddd; padding-top: 16px; margin-top: 16px; }
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
        hr { margin: 20px 0; }
        .telegram-link { display: block; background: #0088cc; color: white; text-align: center; padding: 14px; border-radius: 40px; text-decoration: none; margin-top: 12px; }
        .success-message { background: #d1fae5; color: #065f46; padding: 12px; border-radius: 16px; margin-top: 16px; display: none; }
        .success-message.show { display: block; }
    </style>
</head>
<body>
<div class="app">
    <!-- СТРАНИЦА 1 -->
    <div id="page1" class="page active">
        <h1 style="margin-bottom: 20px;">Что будем вентилировать?</h1>
        <div class="card" data-equipment="Вентиляция для малярных работ">
            <div class="card-img">🎨</div>
            <div><div class="card-title">Вентиляция для малярных работ</div><div class="card-btn">Выбрать →</div></div>
        </div>
        <div class="card" data-equipment="Вентиляция для Кухни">
            <div class="card-img">🍳</div>
            <div><div class="card-title">Вентиляция для Кухни</div><div class="card-btn">Выбрать →</div></div>
        </div>
        <div class="card" data-equipment="Промышленная вентиляция">
            <div class="card-img">🏭</div>
            <div><div class="card-title">Промышленная вентиляция</div><div class="card-btn">Выбрать →</div></div>
        </div>
        <div class="card" data-equipment="Принадлежности к вентиляции">
            <div class="card-img">📦</div>
            <div><div class="card-title">Принадлежности к вентиляции</div><div class="card-btn">Выбрать →</div></div>
        </div>
    </div>

    <!-- СТРАНИЦА 2: ПАРАМЕТРЫ -->
    <div id="page2" class="page">
        <div class="form-card">
            <div id="selectedTitle" class="selected-tag">—</div>
            <div class="mode-switch">
                <button class="mode-btn active" data-mode="work">Рабочая точка</button>
                <button class="mode-btn" data-mode="room">По помещению</button>
            </div>
            <div id="workPanel" class="form-panel show">
                <input type="number" id="capacity" placeholder="Производительность (м³/ч)">
                <input type="number" id="pressure" placeholder="Давление (Па)">
            </div>
            <div id="roomPanel" class="form-panel">
                <div class="grid-3">
                    <input type="number" id="roomW" placeholder="Ширина (м)">
                    <input type="number" id="roomL" placeholder="Длина (м)">
                    <input type="number" id="roomH" placeholder="Высота (м)">
                </div>
                <input type="number" id="distance" placeholder="Расстояние от вентилятора до помещения (м)">
            </div>

            <div id="kitchenBlock" style="display:none;">
                <label style="display: flex; gap: 12px; align-items: center; margin: 16px 0; cursor: pointer;">
                    <input type="checkbox" id="hasHoods"> <span>🍽️ Есть вытяжные зонты</span>
                </label>
                <div id="hoodsSection" class="hoods-section">
                    <input type="number" id="hoodsCount" placeholder="Количество зонтов" min="1" max="10">
                    <div id="hoodsContainer"></div>
                </div>
            </div>

            <div class="double-buttons" style="margin-top: 20px;">
                <button id="withAccessories">➕ С комплектующими</button>
                <button id="withoutAccessories" class="btn-gray">➡️ Без комплектующих</button>
            </div>
            <div class="back-link"><button id="backToMain">← Назад</button></div>
        </div>
    </div>

    <!-- СТРАНИЦА 2.5: ВЫБОР ПРИНАДЛЕЖНОСТЕЙ -->
    <div id="pageAccessories" class="page">
        <div class="form-card">
            <div id="accTitle" class="selected-tag">—</div>
            <div id="accessoriesList"></div>
            <button id="submitAccessories">Выбрать → Далее</button>
            <div class="back-link"><button id="backToParams">← Назад</button></div>
        </div>
    </div>

    <!-- СТРАНИЦА 3: КОНТАКТЫ -->
    <div id="pageContacts" class="page">
        <div class="form-card">
            <div id="contactTitle" class="selected-tag">—</div>
            <div id="selectedAccList" style="background:#f1f5f9; padding:12px; border-radius:16px; margin-bottom:16px; display:none;"></div>
            <input type="text" id="userName" placeholder="* Ваше имя">
            <input type="email" id="userEmail" placeholder="* Электронная почта">
            <input type="text" id="userCity" placeholder="* Город">
            <input type="text" id="userPhone" placeholder="Телефон (необязательно)">
            <textarea id="userComment" rows="3" placeholder="Комментарий"></textarea>
            <hr>
            <button id="copyBtn">📋 Скопировать заявку</button>
            <a href="https://t.me/MIR_OVIK" target="_blank" class="telegram-link">📨 Отправить в Telegram</a>
            <button id="emailBtn" class="btn-gray">✉️ Отправить на почту</button>
            <div class="back-link"><button id="backFromContacts">← Назад</button></div>
            <div id="msg" class="success-message"></div>
        </div>
    </div>
</div>

<script>
    // ДАННЫЕ
    let currentEquipment = "";
    let currentParams = {};
    let selectedAccessories = [];
    let hoodsData = [];

    // ЭЛЕМЕНТЫ
    const page1 = document.getElementById('page1');
    const page2 = document.getElementById('page2');
    const pageAcc = document.getElementById('pageAccessories');
    const pageContacts = document.getElementById('pageContacts');

    // КАТЕГОРИИ ПРИНАДЛЕЖНОСТЕЙ
    const categories = [
        { name: "Воздуховоды и элементы монтажа", items: ["воздуховоды", "фасонные изделия", "гибкие вставки", "хомуты", "кронштейны", "уплотнители"] },
        { name: "Устройства распределения воздуха", items: ["решётки", "диффузоры", "анемостаты", "клапаны"] },
        { name: "Очистка и подготовка воздуха", items: ["фильтры", "рекуператоры", "увлажнители", "ионизаторы"] },
        { name: "Нагревательные и охлаждающие", items: ["калориферы", "охладители"] },
        { name: "Шумо- и виброзащита", items: ["шумоглушители", "виброизоляторы"] },
        { name: "Управление", items: ["датчики", "контроллеры", "приводы", "щиты"] },
        { name: "Вспомогательные", items: ["дефлекторы", "зонты", "люки", "дренаж"] }
    ];

    // ФУНКЦИЯ ДЛЯ ЗОНТОВ
    function generateHoods(count) {
        const container = document.getElementById('hoodsContainer');
        if(!container) return;
        container.innerHTML = '';
        hoodsData = [];
        for(let i=0; i<count; i++) {
            hoodsData.push({w:'', l:'', h:''});
            const div = document.createElement('div');
            div.className = 'hood-item';
            div.innerHTML = `<b>Зонт ${i+1}</b><div class="grid-3" style="margin-top:8px;"><input type="number" placeholder="Ширина мм" class="hw${i}"><input type="number" placeholder="Длина мм" class="hl${i}"><input type="number" placeholder="Высота мм" class="hh${i}"></div>`;
            container.appendChild(div);
            document.querySelector(`.hw${i}`)?.addEventListener('input', (e) => hoodsData[i].w = e.target.value);
            document.querySelector(`.hl${i}`)?.addEventListener('input', (e) => hoodsData[i].l = e.target.value);
            document.querySelector(`.hh${i}`)?.addEventListener('input', (e) => hoodsData[i].h = e.target.value);
        }
    }

    // ОТРИСОВКА СТРАНИЦЫ 2
    function renderPage2() {
        document.getElementById('selectedTitle').innerHTML = `🔧 ${currentEquipment}`;
        const isKitchen = (currentEquipment === "Вентиляция для Кухни");
        const kitchenBlock = document.getElementById('kitchenBlock');
        kitchenBlock.style.display = isKitchen ? 'block' : 'none';
        
        // Сброс зонтов
        const hoodsSection = document.getElementById('hoodsSection');
        hoodsSection.classList.remove('show');
        document.getElementById('hasHoods').checked = false;
        document.getElementById('hoodsContainer').innerHTML = '';
        hoodsData = [];
        
        document.getElementById('hasHoods').onchange = (e) => {
            if(e.target.checked) hoodsSection.classList.add('show');
            else { hoodsSection.classList.remove('show'); document.getElementById('hoodsContainer').innerHTML = ''; hoodsData = []; }
        };
        document.getElementById('hoodsCount').oninput = (e) => {
            let c = parseInt(e.target.value) || 1;
            if(c>10) c=10; if(c<1) c=1;
            generateHoods(c);
        };
    }

    // СБОР ПАРАМЕТРОВ
    function collectParams() {
        const isWork = document.querySelector('#workPanel').classList.contains('show');
        let p = {};
        if(isWork) {
            p.capacity = document.getElementById('capacity').value;
            p.pressure = document.getElementById('pressure').value;
        } else {
            p.roomW = document.getElementById('roomW').value;
            p.roomL = document.getElementById('roomL').value;
            p.roomH = document.getElementById('roomH').value;
            p.distance = document.getElementById('distance').value;
        }
        if(currentEquipment === "Вентиляция для Кухни" && document.getElementById('hasHoods').checked) {
            p.hasHoods = true;
            p.hoodsCount = document.getElementById('hoodsCount').value;
            p.hoods = hoodsData;
        }
        return p;
    }

    // ОТРИСОВКА ПРИНАДЛЕЖНОСТЕЙ
    function renderAccessories() {
        document.getElementById('accTitle').innerHTML = `🔧 ${currentEquipment}`;
        const container = document.getElementById('accessoriesList');
        container.innerHTML = '';
        categories.forEach(cat => {
            const div = document.createElement('div');
            div.style.cssText = 'background:#f8fafc; border-radius:16px; margin-bottom:12px; overflow:hidden;';
            div.innerHTML = `<div style="padding:16px; cursor:pointer; background:white; font-weight:600;" class="catHeader">📦 ${cat.name} <span style="float:right;">▼</span></div><div class="catItems" style="padding:0 16px; max-height:0; overflow:hidden; transition:0.2s;">${cat.items.map(i => `<label style="display:block; padding:8px 0;"><input type="checkbox" value="${i}"> ${i}</label>`).join('')}</div>`;
            const header = div.querySelector('.catHeader');
            const itemsDiv = div.querySelector('.catItems');
            header.onclick = () => {
                const isOpen = itemsDiv.style.maxHeight;
                itemsDiv.style.maxHeight = isOpen ? '0' : '300px';
                header.innerHTML = `📦 ${cat.name} <span style="float:right;">${isOpen ? '▼' : '▲'}</span>`;
            };
            container.appendChild(div);
        });
    }

    // ПОКАЗ КОНТАКТОВ
    function showContacts() {
        document.getElementById('contactTitle').innerHTML = `🔧 ${currentEquipment}`;
        const accDiv = document.getElementById('selectedAccList');
        if(selectedAccessories.length) {
            accDiv.style.display = 'block';
            accDiv.innerHTML = `<span>✅ Выбранные комплектующие:</span> ${selectedAccessories.join(', ')}`;
        } else accDiv.style.display = 'none';
    }

    // ФОРМИРОВАНИЕ ТЕКСТА ЗАЯВКИ
    function getOrderText() {
        const name = document.getElementById('userName').value.trim() || 'не указано';
        const email = document.getElementById('userEmail').value.trim() || 'не указан';
        const city = document.getElementById('userCity').value.trim() || 'не указан';
        const phone = document.getElementById('userPhone').value.trim() || 'не указан';
        const comment = document.getElementById('userComment').value.trim() || 'нет';
        
        let paramsText = '';
        if(currentParams.capacity) paramsText = `Рабочая точка: ${currentParams.capacity} м³/ч, ${currentParams.pressure || '?'} Па`;
        else paramsText = `По помещению: ${currentParams.roomW||'?'}×${currentParams.roomL||'?'}×${currentParams.roomH||'?'} м, расстояние ${currentParams.distance||'?'} м`;
        
        let hoodsText = '';
        if(currentParams.hasHoods && currentParams.hoods) {
            hoodsText = `\nЗонты (${currentParams.hoodsCount||0} шт.):`;
            currentParams.hoods.forEach((h,i) => hoodsText += `\n  Зонт ${i+1}: ${h.w||'?'}×${h.l||'?'}×${h.h||'?'} мм`);
        }
        
        return `🔔 НОВАЯ ЗАЯВКА НА ВЕНТИЛЯЦИЮ

📌 Тип: ${currentEquipment}

📊 Параметры:
${paramsText}${hoodsText}

📦 Принадлежности: ${selectedAccessories.join(', ') || 'нет'}

👤 Контакты:
  Имя: ${name}
  Email: ${email}
  Город: ${city}
  Телефон: ${phone}
  Комментарий: ${comment}`;
    }

    function getMailLink() {
        const name = document.getElementById('userName').value.trim() || '';
        const email = document.getElementById('userEmail').value.trim() || '';
        const city = document.getElementById('userCity').value.trim() || '';
        const phone = document.getElementById('userPhone').value.trim() || '';
        const comment = document.getElementById('userComment').value.trim() || '';
        let paramsText = '';
        if(currentParams.capacity) paramsText = `${currentParams.capacity} м³/ч, ${currentParams.pressure||'?'} Па`;
        else paramsText = `${currentParams.roomW||'?'}×${currentParams.roomL||'?'}×${currentParams.roomH||'?'} м, ${currentParams.distance||'?'} м`;
        let hoodsText = '';
        if(currentParams.hasHoods) hoodsText = `\nЗонты: ${currentParams.hoodsCount||0} шт.`;
        const body = `Новая заявка\n\nТип: ${currentEquipment}\nПараметры: ${paramsText}${hoodsText}\nПринадлежности: ${selectedAccessories.join(', ') || 'нет'}\n\nИмя: ${name}\nEmail: ${email}\nГород: ${city}\nТелефон: ${phone}\nКомментарий: ${comment}`;
        return `mailto:mirovik@mir-ovik.ru?subject=${encodeURIComponent(`Заявка: ${currentEquipment}`)}&body=${encodeURIComponent(body)}`;
    }

    function showMessage(text, isError=false) {
        const msgDiv = document.getElementById('msg');
        msgDiv.innerHTML = text;
        msgDiv.classList.add('show');
        if(isError) msgDiv.style.background = '#fee2e2';
        else msgDiv.style.background = '#d1fae5';
        setTimeout(() => msgDiv.classList.remove('show'), 3000);
    }

    // ПЕРЕКЛЮЧЕНИЕ РЕЖИМОВ НА СТР.2
    function initModeSwitch() {
        const workBtn = document.querySelector('[data-mode="work"]');
        const roomBtn = document.querySelector('[data-mode="room"]');
        const workPanel = document.getElementById('workPanel');
        const roomPanel = document.getElementById('roomPanel');
        workBtn.onclick = () => { workBtn.classList.add('active'); roomBtn.classList.remove('active'); workPanel.classList.add('show'); roomPanel.classList.remove('show'); };
        roomBtn.onclick = () => { roomBtn.classList.add('active'); workBtn.classList.remove('active'); roomPanel.classList.add('show'); workPanel.classList.remove('show'); };
    }

    // ПЕРЕХОДЫ ПО КАРТОЧКАМ
    document.querySelectorAll('.card').forEach(card => {
        card.onclick = () => {
            currentEquipment = card.getAttribute('data-equipment');
            if(currentEquipment === "Принадлежности к вентиляции") {
                currentParams = {};
                selectedAccessories = [];
                renderAccessories();
                page1.classList.remove('active');
                pageAcc.classList.add('active');
            } else {
                renderPage2();
                page1.classList.remove('active');
                page2.classList.add('active');
                initModeSwitch();
            }
        };
    });

    // КНОПКИ НА СТР.2
    document.getElementById('withAccessories').onclick = () => {
        currentParams = collectParams();
        renderAccessories();
        page2.classList.remove('active');
        pageAcc.classList.add('active');
    };
    document.getElementById('withoutAccessories').onclick = () => {
        currentParams = collectParams();
        selectedAccessories = [];
        showContacts();
        page2.classList.remove('active');
        pageContacts.classList.add('active');
    };
    document.getElementById('backToMain').onclick = () => {
        page2.classList.remove('active');
        page1.classList.add('active');
    };

    // КНОПКИ НА СТР. ПРИНАДЛЕЖНОСТЕЙ
    document.getElementById('submitAccessories').onclick = () => {
        selectedAccessories = [];
        document.querySelectorAll('#accessoriesList input:checked').forEach(cb => selectedAccessories.push(cb.value));
        showContacts();
        pageAcc.classList.remove('active');
        pageContacts.classList.add('active');
    };
    document.getElementById('backToParams').onclick = () => {
        pageAcc.classList.remove('active');
        page2.classList.add('active');
    };

    // КНОПКИ НА СТР. КОНТАКТОВ
    document.getElementById('copyBtn').onclick = () => {
        if(!document.getElementById('userName').value.trim() || !document.getElementById('userEmail').value.trim() || !document.getElementById('userCity').value.trim()) {
            showMessage('❌ Заполните имя, email и город', true);
            return;
        }
        navigator.clipboard.writeText(getOrderText());
        showMessage('✅ Заявка скопирована! Отправьте её в Telegram или по почте.');
    };
    document.getElementById('emailBtn').onclick = () => {
        if(!document.getElementById('userName').value.trim() || !document.getElementById('userEmail').value.trim() || !document.getElementById('userCity').value.trim()) {
            showMessage('❌ Заполните имя, email и город', true);
            return;
        }
        window.location.href = getMailLink();
        showMessage('✉️ Открывается почтовый клиент');
    };
    document.getElementById('backFromContacts').onclick = () => {
        if(selectedAccessories.length > 0) {
            pageContacts.classList.remove('active');
            pageAcc.classList.add('active');
        } else {
            pageContacts.classList.remove('active');
            page2.classList.add('active');
        }
    };
</script>
</body>
</html>
